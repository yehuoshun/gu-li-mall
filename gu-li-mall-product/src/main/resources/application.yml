spring:
  config:
    # 配置中心（与注册中心同一个 Nacos 3.x 实例；optional: 保证 Nacos 不可用时降级启动）
    # 优先级：本地 application.yml > 这里导入的 Nacos 配置（Boot 规则），想让 Nacos 覆盖就别在本地写同名键
    import:
      - optional:nacos:gu-li-mall-common.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:gu-li-mall-product.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  application:
    name: gu-li-mall-product
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地 MySQL 8（连接参数：UTF-8 / 时区 / 关 SSL / 允许 caching_sha2_password 公钥获取）
    url: jdbc:mysql://127.0.0.1:3306/gu_li_mall_pms?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  cloud:
    nacos:
      # 本地 nacos-win（standalone 单机），主端口默认 8848（Nacos 3.x 控制台改到 8080）
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: public        # 命名空间：本项目管理重建，统一用默认 public
        group: DEFAULT_GROUP     # 分组：统一默认分组
      # 鉴权：Nacos 3.x 默认开启控制台/管控 API 鉴权，客户端注册同样需要账号密码
      # （不开鉴权/2.x 服务端可忽略；占位符写法避免把真实密码提交进仓库）
      # 改过控制台密码时，用环境变量覆盖：IDEA Run Configuration → Environment variables
      #   NACOS_USERNAME=xxx;NACOS_PASSWORD=xxx
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}

server:
  port: 10010
